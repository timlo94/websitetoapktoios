steps:
  # Step 1: Build the container image using your Lovable Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/saaslovable:$COMMIT_SHA', '.']

  # Step 2: Push the finished image to your project storage registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/saaslovable:$COMMIT_SHA']

  # Step 3: Deploy the image to Cloud Run to generate your live hosted link
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'saaslovable'
      - '--image'
      - 'gcr.io/$PROJECT_ID/saaslovable:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY